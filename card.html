<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Card</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="card m-4" style="width: 18rem;">
        
        <!-- Image Link -->
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500"
             class="card-img-top"
             alt="Nature Image">

        <div class="card-body">
            <h5 class="card-title">Nature Card</h5>

            <p class="card-text">
                Beautiful nature image using an online image link.
            </p>

            <a href="https://unsplash.com" class="btn btn-primary">
                Visit
            </a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
